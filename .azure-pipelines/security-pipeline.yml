trigger:
  branches:
    include:
      - main  # Runs when code is pushed to main

pr:
  branches:
    include:
      - main  # Runs PR validation before merging into main

pool:
  name: adopool  

variables:
  - group: SonarQubeSettings  # Reference the Variable Group with SonarQube details

stages:
  - stage: SonarQubeAnalysis  # Separate stage for SonarQube preparation and analysis
    displayName: "SonarQube Analysis"
    jobs:
      - job: SonarQubeAnalysisJob
        displayName: "Prepare and Analyze Code with SonarQube"
        steps:
          # SonarQube Prepare Step
          - task: SonarQubePrepare@5
            displayName: 'Prepare SonarQube Analysis'
            inputs:
              SonarQube: $(SonarQubeServiceConnection)  # Use variable from the variable group
              scannerMode: 'MSBuild'
              projectKey: $(SonarQubeProjectKey)  # Use SonarQube project key from the variable group
              projectName: $(SonarQubeProjectName)  # Use SonarQube project name from the variable group

          # Run SonarQube Analysis
          - task: SonarQubeAnalyze@5
            displayName: 'Run SonarQube Analysis'

          # Publish SonarQube Results
          - task: SonarQubePublish@5
            displayName: 'Publish SonarQube Results'

          # Xray Integration - Publish the SonarQube report to Xray
          - task: XrayReportPublisher@1  # Assuming there's an Xray task available
            displayName: 'Publish SonarQube Report to Xray'
            inputs:
              XrayConnection: $(XrayConnection)  # Use Xray service connection from the variable group
              SonarQubeProjectKey: $(SonarQubeProjectKey)  # Use SonarQube project key from the variable group
              SonarQubeReportPath: '$(Build.ArtifactStagingDirectory)/sonarqube-report.json'  
              XrayIssueKey: $(XrayIssueKey)  # Reference Xray Issue or Project Key

  - stage: Build
    displayName: "Build Stage"
    jobs:
      - job: BuildJob
        displayName: "Build and Test Job"
        steps:
          - template: templates/install-dependencies.yml
          - template: templates/run-tests.yml
          - template: templates/build-app.yml

          # You can optionally add a Quality Gate Check here if you want to ensure the build fails if the quality gate isn't passed
          - task: SonarQubeQualityGate@5
            displayName: 'Check SonarQube Quality Gate'
            inputs:
              SonarQube: $(SonarQubeServiceConnection)

  - stage: Publish
    displayName: "Publish Stage"
    jobs:
      - job: PublishJob
        displayName: "Publish Build Artifacts"
        steps:
          - template: templates/publish-artifact.yml
