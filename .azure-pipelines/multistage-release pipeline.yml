trigger:
  branches:
    include:
      - main  # Runs pipeline on changes to main branch

resources:
  pipelines:
    - pipeline: build-pipeline
      source: build-pipeline
      trigger: true  # Auto-trigger after CI pipeline completes

pool:
  name:  'adopool'

variables:
  configPath: "$(Build.SourcesDirectory)/config"

stages:
  
  # 🔹 DEV ENVIRONMENT DEPLOYMENT
  - stage: Dev
    displayName: "Deploy to Dev"
    jobs:
      - job: DeployDev
        displayName: "Deploy App to Dev"
        steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: "webapp-ServiceConnection"
              appName: "my-dev-app"
              package: "$(Pipeline.Workspace)/drop/node-app.zip"

          - task: CopyFiles@2
            displayName: "Copy Dev Configuration"
            inputs:
              SourceFolder: "$(configPath)"
              Contents: "dev-config.json"
              TargetFolder: "$(Build.ArtifactStagingDirectory)/config"

  # 🔹 TEST ENVIRONMENT DEPLOYMENT
  - stage: Test
    displayName: "Deploy to Test"
    dependsOn: Dev
    condition: succeeded()
    jobs:
      - job: DeployTest
        displayName: "Deploy App to Test"
        steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: "webapp-ServiceConnection"
              appName: "my-test-app"
              package: "$(Pipeline.Workspace)/drop/node-app.zip"

          - task: CopyFiles@2
            displayName: "Copy Test Configuration"
            inputs:
              SourceFolder: "$(configPath)"
              Contents: "test-config.json"
              TargetFolder: "$(Build.ArtifactStagingDirectory)/config"

  # 🔹 PROD ENVIRONMENT DEPLOYMENT (Requires Manual Approval)
  - stage: Prod
    displayName: "Deploy to Prod"
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: WaitForApproval
        displayName: "Approval Required Before Production Deployment"
        steps:
          - task: ManualValidation@0
            timeoutInMinutes: 60
            notifyUsers:
              - "sritish.devops@example.com"
            instructions: "Please verify and approve deployment to Production."

      - job: DeployProd
        displayName: "Deploy App to Prod"
        dependsOn: WaitForApproval
        condition: succeeded()
        steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: "webapp-ServiceConnection"
              appName: "my-prod-app"
              package: "$(Pipeline.Workspace)/drop/node-app.zip"

          - task: CopyFiles@2
            displayName: "Copy Prod Configuration"
            inputs:
              SourceFolder: "$(configPath)"
              Contents: "prod-config.json"
              TargetFolder: "$(Build.ArtifactStagingDirectory)/config"
