trigger:
  branches:
    include:
      - main  # Runs when code is pushed to main

pool:
  name: 'adopool'

variables:
  - group: kv-secrets  # Fetch secrets from Key Vault

stages:
- stage: Deploy
  displayName: "Deploy to Azure App Service"
  jobs:
    - deployment: DeployApp
      displayName: "Deploy Application"
      environment: "Staging"
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureKeyVault@2
                inputs:
                  azureSubscription: 'keyvaultServiceConnection'
                  KeyVaultName: 'my-keyvault'
                  SecretsFilter: '*'
                  RunAsPreJob: true

              - task: AzureWebApp@1
                inputs:
                  azureSubscription: 'WebappServiceConnection'
                  appName: 'my-nodejs-app'
                  package: '$(Pipeline.Workspace)/drop/app.zip'
                  appSettings: |
                    -DATABASE_URL=$(DB_CONNECTION_STRING)
                    -NODE_ENV=staging  # Changed from production to staging
