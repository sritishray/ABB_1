trigger:
  branches:
    include:
      - main  # Trigger the pipeline on changes to the main branch

pool:
  name: adopool


variables:
  # Azure Container Registry and Docker image name
  ACR_NAME: 'devops.azurecr.io'
  IMAGE_NAME: 'nodejs -app'
  TAG: '$(Build.BuildId)'  # Using Build ID as the image tag

steps:

# Step 1: Checkout code
- checkout: self

# Step 2: Set up Node.js environment
- task: UseNode@1
  displayName: 'Set up Node.js'
  inputs:
    versionSpec: '16.x'  # You can change the version based on your app requirements

# Step 3: Install dependencies
- script: |
    npm install
  displayName: 'Install dependencies'

# Step 4: Run unit tests
- script: |
    npm test  # Runs the tests defined in your package.json (e.g., Jest or Mocha)
  displayName: 'Run unit tests'

# Step 5: Build Docker image
- task: Docker@2
  displayName: 'Build Docker Image'
  inputs:
    command: 'build'
    Dockerfile: '**/Dockerfile'
    tags: $(ACR_NAME)/$(IMAGE_NAME):$(TAG)
    buildContext: '.'  # Ensure that Docker build uses the right context

# Step 6: Run Trivy security scan
- script: |
    echo "Running Trivy vulnerability scan on the Docker image"
    docker run --rm \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v $(Build.SourcesDirectory):/project \
      aquasec/trivy:latest \
      --exit-code 1 \
      --severity HIGH,CRITICAL \
      --no-progress \
      --ignore-unfixed \
      --input /project/Dockerfile
  displayName: 'Run Trivy Security Scan'
  
# Step 7: Push Docker image to ACR (if scan is successful)
- script: |
    echo "Pushing Docker image to ACR"
    docker push $(ACR_NAME)/$(IMAGE_NAME):$(TAG)
  displayName: 'Push Image to ACR'
  condition: succeededOrFailed()  # This ensures the push happens even if the scan fails, but scan failure will stop the build
